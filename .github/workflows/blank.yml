name: Deploy BOB to GitHub Pages

on:
  # Deploy when the website or this workflow changes.
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/deploy-bob.yml"

  # Allow manual deployment from the Actions tab.
  workflow_dispatch:

# Each job receives only the permissions it needs.
permissions:
  contents: read

# Avoid overlapping production deployments.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Prepare BOB website
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check that BOB exists
        shell: bash
        run: |
          if [ ! -s index.html ]; then
            echo "::error::index.html is missing or empty. Put it in the repository root."
            exit 1
          fi

      - name: Prepare website files
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      # Only the prepared website is uploaded—not the full repository.
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish BOB
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
